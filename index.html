<style id="working-effects">
html.flicker-loading{ background:#050507; }
body.flicker-loading #root{ visibility:hidden; }
#flicker-overlay{
  position:fixed; inset:0; z-index:99999; background:#050507;
  display:flex; align-items:center; justify-content:center; pointer-events:none;
  transition: opacity 0.6s ease;
}
#flicker-overlay.hidden{ opacity:0; }
.flicker-lines{
  position:absolute; inset:0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 4px);
}
.flicker-text{
  color:rgba(255,255,255,0.6); font-family:ui-monospace,monospace; font-size:11px; letter-spacing:0.3em;
  animation: text-flicker 0.6s infinite;
}
@keyframes text-flicker{
  0%,18%,22%,25%,53%,57%,100%{opacity:1} 20%,24%,55%{opacity:0.15}
}
.flicker-item{ opacity:0; transform: translateY(14px); will-change: opacity, transform; }
.flicker-item.flickering{ animation: flicker-phase 0.45s linear forwards; }
.flicker-item.shown{
  opacity:1; transform: translateY(0);
  transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1);
}
@keyframes flicker-phase{
  0%{opacity:0; filter:brightness(2)} 10%{opacity:1; filter:brightness(1.8)}

  30%{opacity:0.3} 35%{opacity:1} 55%{opacity:0.2} 60%{opacity:1} 70%{opacity:0.6} 75%{opacity:1} 100%{opacity:1}
}
body.crt-flash{ animation: crt-flash 0.18s ease; }
@keyframes crt-flash{ 0%{filter:brightness(1.8)} 100%{filter:brightness(1)} }

        .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }
        .constellation-stable { transform: translateZ(0); backface-visibility: hidden; will-change: transform; isolation: isolate; }
        .constellation-node { transform: translateZ(0); backface-visibility: hidden; }
        /* Ensure starfield canvases are behind and visible */
        canvas.fixed { display: block !important; }

        .noise::after{ background-image:none !important; display:none !important; }
.fixed.inset-0.pointer-events-none{ display:none !important; }
div[class*="bg-[radial-gradient"]{ background-image:none !important; background:none !important; }

<script id="flicker-logic">
(function(){
  document.documentElement.classList.add('flicker-loading');
  document.body.classList.add('flicker-loading');
  function collect(){
    const root=document.getElementById('root');
    if(!root) return [];
    const all=root.querySelectorAll('*');
    const filtered=Array.from(all).filter(el=>{
      if(['SCRIPT','STYLE','LINK','META','NOSCRIPT'].includes(el.tagName)) return false;
      if(el.children.length>8) return false;
      const r=el.getBoundingClientRect();
      if(r.width===0 && r.height===0) return false;
      return true;
    });
    return Array.from(new Set([...root.children, ...filtered])).slice(0,150);
  }
  function start(){
    const overlay=document.getElementById('flicker-overlay');
    const els=collect();
    els.forEach(el=>el.classList.add('flicker-item'));
    document.documentElement.classList.remove('flicker-loading');
    document.body.classList.remove('flicker-loading');
    document.body.classList.add('crt-flash');
    if(overlay){ setTimeout(()=>{overlay.classList.add('hidden'); setTimeout(()=>overlay.style.display='none',700);},250); }
    els.forEach((el,i)=>{
      const d=i*38;
      setTimeout(()=>el.classList.add('flickering'), d);
      setTimeout(()=>{ el.classList.remove('flickering'); el.classList.add('shown'); }, d+450);
    });
    setTimeout(()=>{ els.forEach(el=>el.classList.remove('flicker-item','flickering','shown')); document.body.classList.remove('crt-flash'); }, els.length*38+1200);
  }
  if(document.readyState==='complete' || document.readyState==='interactive'){ setTimeout(start,120); }
  else{ window.addEventListener('DOMContentLoaded',()=>setTimeout(start,120)); }
  window.addEventListener('load',()=>{ if(!document.querySelector('.flicker-item')) setTimeout(start,80); });
})();
</script>
